<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satisfactory Phase Guide</title>
<meta name="description" content="A first-playthrough guide to Satisfactory 1.2, one Space Elevator phase at a time.">
<meta name="theme-color" content="#ECEAE4">
<!-- Home Screen web app (iPadOS / iOS) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phase Guide">
<!-- black-translucent: the linen runs under the status bar. Use "default" for a solid bar. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components/bundle.css">
<style>
/* Layout: the guide as a binder. Manila folder tabs (PhaseTrack) sit on display
   linen above a paper masthead; under it, a dark-linen sidebar of milestones,
   a middle column (build order, healthy targets) and a detail sheet. The
   Toolkit drops down from the top on dark linen, like Notification Center.
   Colors, type and depth come from Skeuo 2012 (light edition: a deliberate
   single light theme); the tokens here are layout glue only. */
:root {
  --wrap: 1400px;
  --gap: 18px;
  --gutter: 24px;
  --top-h: 52px;
  /* Home Screen app: iPadOS blurs a band under the status bar, so the top bar moves below it */
  --top-extra: 0px;
  --top-pad: calc(max(8px, env(safe-area-inset-top, 0px)) + var(--top-extra));
  /* folder-tab tints: the system's four phase colours plus peach and lavender */
  --tab-yellow: var(--sk-phase-discover, #F6D365);
  --tab-peach: #F7B98A;
  --tab-pink: var(--sk-phase-define, #F4A6B8);
  --tab-lavender: #C6B0EE;
  --tab-blue: var(--sk-phase-develop, #8FB8EC);
  --tab-green: var(--sk-phase-deliver, #B9E25A);
  color-scheme: light;
}
html.is-standalone { --top-extra: 28px; }
@media (display-mode: standalone) { :root { --top-extra: 28px; } }
html, body { height: 100%; }
/* The linen sits on <html> too (class added by app.js), so it also fills any strip iPadOS shows
   outside the layout viewport in the Home Screen app. */
html { background-color: var(--sk-linen-display, #ECEAE4); }
/* What iPadOS shows past the page uses this colour: dim it with the Toolkit's shade */
html.sk-linen.drawer-open { background-color: #9A9897; }
/* Home Screen app laid out short: stretch the page over the missing strip (--vp-gap is measured in app.js) */
html.has-vp-gap { height: calc(100% + var(--vp-gap, 0px)); }
html.has-vp-gap, html.has-vp-gap body { overflow: hidden; }
body { display: flex; flex-direction: column; margin: 0; background: transparent; color: var(--sk-ink); font-family: var(--font-ui); -webkit-text-size-adjust: 100%; }
#root { flex: 1 0 auto; display: flex; flex-direction: column; }
.app { flex: 1 0 auto; display: flex; flex-direction: column; }
*, *::before, *::after { box-sizing: border-box; }
.gutters {
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px), calc((100% - var(--wrap)) / 2 + var(--gutter)));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px), calc((100% - var(--wrap)) / 2 + var(--gutter)));
}

/* ---- top bar: binder tabs on the left, controls on the right ---- */
.topbar {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  min-height: var(--top-h); padding-top: var(--top-pad);
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px), calc((100% - var(--wrap)) / 2 + var(--gutter)));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px), calc((100% - var(--wrap)) / 2 + var(--gutter)));
  position: relative; z-index: 20;
}
.topbar__tabs { flex: 0 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding-top: 6px; margin-bottom: -1px; }
.topbar__tabs::-webkit-scrollbar { display: none; }
.topbar__tools { flex: none; display: flex; align-items: center; gap: 8px; padding-bottom: 10px; }
.topbar__count { font: 700 12px/1 var(--font-ui); color: var(--sk-ios-header); text-shadow: var(--sk-emboss-light); font-variant-numeric: tabular-nums; margin-right: 2px; }

/* ---- masthead ---- */
.mast.sk-masthead {
  position: relative; z-index: 10;
  padding: 12px max(var(--gutter), env(safe-area-inset-right, 0px), calc((100% - var(--wrap)) / 2 + var(--gutter))) 14px max(var(--gutter), env(safe-area-inset-left, 0px), calc((100% - var(--wrap)) / 2 + var(--gutter))) !important;
}
.mast .sk-title { font-size: 38px; margin: 8px 0 4px !important; }
.mast .sk-title::after { margin-top: 8px !important; }
.mast .sk-masthead__number { font-size: 92px; }
.mast .sk-masthead__text > div:last-child, .mast > div:last-child { margin-top: 10px !important; }
.tapes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }

/* ---- screens ---- */
.screen {
  flex: 1 0 auto; padding-block: 14px 10px; position: relative; z-index: 15; /* above the masthead, so popovers can overlap it */
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px), calc((100% - var(--wrap)) / 2 + var(--gutter)));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px), calc((100% - var(--wrap)) / 2 + var(--gutter)));
}
.card { min-width: 0; }
.linen-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; margin: 0 2px 10px; flex-wrap: wrap; }
.linen-head__label { font: 700 15px/1.2 var(--font-ui); color: var(--sk-ios-header); text-shadow: var(--sk-emboss-light); }
.toolbar { margin-bottom: 14px; }

/* ---- phase grid ---- */
.phase-grid { display: grid; gap: var(--gap); align-items: start; grid-template-columns: minmax(250px, 0.62fr) minmax(0, 0.9fr) minmax(0, 1.3fr); }
.mid { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.side {
  min-width: 0; border-radius: 8px; padding: 14px 12px 4px;
  box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.7);
}
.side .sk-group { margin-bottom: 16px; }
.side .sk-group__title { margin-left: 6px; }
.side .sk-group__row { padding: 0; min-height: 40px; align-items: center; font-size: 13.5px; }
.side .sk-group__row > span:first-child { flex: 1 1 auto; min-width: 0; align-self: stretch; display: flex; }
.side .sk-group__row > span:last-child:not(:first-child) { padding-right: 8px; }
.side .nav-row--check:not(.nav-row) { padding: 6px 8px 6px 12px; }
.row-btn {
  appearance: none; margin: 0; border: 0; background: none; width: 100%; cursor: pointer;
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 8px 12px; text-align: left; font: inherit; color: inherit;
}
.row-btn:focus-visible { outline: 2px solid var(--sk-blue-hi); outline-offset: -3px; border-radius: 6px; }
.row-sub { font: 400 11px/1.2 var(--font-ui); color: var(--sk-muted); }
.nav-row:not(.nav-row--check) .row-btn { padding-right: 28px; position: relative; }
.nav-row:not(.nav-row--check) .row-btn::after {
  content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; margin-top: -4px;
  border-right: 2px solid #8e96a3; border-top: 2px solid #8e96a3; transform: rotate(45deg);
}
/* ---- milestones as a to-do note: struck through when done ---- */
.side-h { margin: 0 6px 7px 16px; }
.mnote.sk-notepad {
  --sk-notepad-head: var(--sk-rule);
  --sk-notepad-margin: 28px;
  padding: var(--sk-rule) 12px var(--sk-rule) calc(var(--sk-notepad-margin) + 12px);
  margin: 0 4px 16px;
}
.mnote .sk-notepad__body > .mnote__h { margin: 0; font: 700 10.5px/var(--sk-rule) var(--font-ui); letter-spacing: 2px; text-transform: uppercase; color: var(--sk-blue-ink); }
.mnote .sk-notepad__body > .mnote__list { list-style: none; margin: 0; padding: 0; }
.mnote__btn {
  appearance: none; border: 0; background: none; margin: 0; padding: 0; width: 100%;
  text-align: left; cursor: pointer; font: 400 14px/var(--sk-rule) var(--font-ui); color: var(--sk-ink);
}
.mnote__btn:focus-visible { outline: 2px solid var(--sk-blue-hi); outline-offset: 1px; border-radius: 2px; }
.mnote__text { padding: 0 2px; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.mnote__line.is-selected .mnote__text { font-weight: 700; background: linear-gradient(transparent 22%, var(--sk-lime-wash) 22%, var(--sk-lime-wash) 92%, transparent 92%); }
.mnote__line.is-done .mnote__text { color: var(--sk-muted); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: var(--sk-ink-soft); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
/* step numbers sit in the red margin of the sidebar list */
.mnote__btn { position: relative; }
.mnote__num { position: absolute; left: calc(-1 * (var(--sk-notepad-margin) + 12px)); width: var(--sk-notepad-margin); text-align: center; font: 400 12px/var(--sk-rule) var(--font-ui); color: var(--sk-muted); font-variant-numeric: tabular-nums; }
.mnote__line.is-selected .mnote__num { color: var(--sk-blue-ink); font-weight: 700; }

/* ---- the open step: a notepad page with a to-do list ---- */
.sheet.sk-notepad { --sk-notepad-head: calc(var(--sk-rule) * 4); padding-bottom: var(--sk-rule); min-width: 0; }
.sheet .sk-notepad__title { height: var(--sk-notepad-head); padding-top: calc(var(--sk-rule) + 5px); }
.sheet__kicker { display: block; font: 700 11px/var(--sk-rule) var(--font-ui); letter-spacing: 2.5px; text-transform: uppercase; color: var(--sk-blue-ink); text-shadow: var(--sk-emboss-light); }
.sheet__title { display: block; font: 200 26px/var(--sk-rule) var(--font-display); color: var(--sk-ink); }
.sheet .sk-notepad__body > .sheet__intro { margin: 0 0 var(--sk-rule); color: var(--sk-ink-soft); }
.sheet .sk-notepad__body > .tasks { list-style: none; margin: 0 0 var(--sk-rule); padding: 0; }
.task { position: relative; color: var(--sk-ink); }
.task__hit {
  position: absolute; top: 0; bottom: 0; left: calc(-1 * (var(--sk-notepad-margin) + 16px)); right: -10px;
  appearance: none; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; border-radius: 3px;
}
.task__hit:focus-visible { outline: 2px solid var(--sk-blue-hi); outline-offset: -2px; }
.task__hit:active { background: rgba(43, 90, 165, 0.06); }
.task__box {
  position: absolute; top: 5px; width: 12px; height: 12px; pointer-events: none;
  left: calc(-1 * (var(--sk-notepad-margin) + 16px) + (var(--sk-notepad-margin) - 14px) / 2);
  border: 1.5px solid #7d93b3; border-radius: 2px; background: rgba(255, 255, 255, 0.7);
}
.task.is-done .task__box::after {
  content: ""; position: absolute; left: 3px; top: -4px; width: 5px; height: 11px;
  border: solid var(--sk-blue); border-width: 0 2.5px 2.5px 0; transform: rotate(40deg);
}
.task__text { position: relative; pointer-events: none; }
.task.is-done .task__text { color: var(--sk-muted); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: var(--sk-ink-soft); }
.task__tree { color: var(--sk-muted); font-style: italic; }
.task .sk-popover-anchor { pointer-events: auto; }
.task .sk-popover { color: var(--sk-ink); font-weight: 400; text-align: left; }
.mlink {
  appearance: none; border: 0; background: none; padding: 0; margin: 0; cursor: pointer;
  font: inherit; font-weight: 700; color: var(--sk-blue-ink);
  text-decoration: underline; text-decoration-color: rgba(43, 90, 165, 0.35); text-underline-offset: 3px;
}
.task.is-done .mlink { color: var(--sk-muted); text-decoration: line-through; }
.mlink:focus-visible { outline: 2px solid var(--sk-blue-hi); outline-offset: 2px; border-radius: 2px; }
.mi-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin: 8px 0 4px; }
.sheet .sk-notepad__body > .snotes { list-style: none; margin: 0 0 var(--sk-rule); padding: 0; }
.snotes li { display: grid; grid-template-columns: 46px minmax(0, 1fr); column-gap: 8px; align-items: start; font-size: 13.5px; color: var(--sk-ink-soft); }
.snotes .sk-label { justify-self: start; transform: scale(0.82); transform-origin: left center; margin-top: 1px; }
.sheet .sk-notepad__body > .sheet__plans { margin: 0 0 var(--sk-rule); display: flex; flex-wrap: wrap; column-gap: 18px; }
.sheet__plans .link, .sheet__next .link { line-height: var(--sk-rule); font-size: 14px; }
.sheet .sk-notepad__body > .sheet__next { margin: 0; }
.sheet__sticky { display: flex; justify-content: flex-end; margin-top: var(--sk-rule); }
.sheet__sticky .sk-sticky { width: 250px; }
.glance-block .linen-head { margin-bottom: 8px; }
.glance.sk-paper { padding: 10px 18px 12px !important; }

/* the Done tapes sit at the end of a tab's tape row */
.tapes__end { margin-left: auto; display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.done-btn { flex: none; }

/* iOS 6 selected cell */
.side .sk-group__row.is-selected {
  background: linear-gradient(#4b8ae0, var(--sk-blue) 50%, var(--sk-blue-lo));
  color: #fff; text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.35);
}
.side .sk-group__row.is-selected .row-sub { color: rgba(255, 255, 255, 0.82); }
.side .sk-group__row.is-selected .row-btn::after { border-color: #fff; }
.side .sk-group__row.is-selected + .sk-group__row { border-top-color: transparent; }

/* ---- build order notepad: compact accordion on the rules ---- */
.build.sk-notepad { padding-bottom: var(--sk-rule); }
.build .sk-step + .sk-step { margin-top: 0; }
.build .sk-step.is-open { margin-bottom: var(--sk-rule); }
.build .sk-step .sk-badge { transform: scale(0.82); }
.step-toggle {
  appearance: none; margin: 0; padding: 0; border: 0; background: none; cursor: pointer;
  font: inherit; color: inherit; text-align: left; line-height: var(--sk-rule);
}
.step-toggle:focus-visible { outline: 2px solid var(--sk-blue-hi); outline-offset: 1px; border-radius: 2px; }
.step-toggle::after { content: " ›"; color: var(--sk-muted); font-weight: 400; }
.step-toggle[aria-expanded="true"]::after { content: ""; }

/* ---- targets ---- */
.targets-block .linen-head { margin-bottom: 8px; }
.targets.sk-paper { padding: 14px 18px !important; }
.power { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; flex-wrap: wrap; }
.power__value { font: 200 38px/1 var(--font-display); letter-spacing: -1px; color: var(--sk-ink); text-shadow: var(--sk-emboss-light); font-variant-numeric: tabular-nums; }
.power__unit { font: 300 20px/1 var(--font-display); color: var(--sk-ios-header); }
.power__label { font: 400 13px/1.3 var(--font-ui); color: var(--sk-muted); }
.bl-compact.sk-barlist { gap: 7px; }
.bl-compact .sk-barlist__row { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) auto; gap: 10px; }
.bl-compact .sk-barlist__label { font-size: 13px; }
.bl-compact .sk-barlist__track { height: 10px; }
.bl-compact .sk-barlist__value { font-size: 18px; min-width: 56px; font-variant-numeric: tabular-nums; }
.more, .link {
  appearance: none; margin: 8px 0 0; padding: 0; border: 0; background: none; cursor: pointer;
  font: 700 12px/1.3 var(--font-ui); color: var(--sk-blue-ink); text-align: left;
}
.more:hover, .link:hover { text-decoration: underline; }
.more:focus-visible, .link:focus-visible { outline: 2px solid var(--sk-blue-hi); outline-offset: 2px; border-radius: 2px; }

/* ---- detail sheet ---- */
.detail.sk-paper { padding: 18px 22px 22px !important; }
.detail__head { margin-bottom: 12px; }
.detail__title { margin: 6px 0 10px; font: 200 30px/1.1 var(--font-display); color: var(--sk-ink); text-shadow: var(--sk-emboss-light); }
.detail-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; margin-top: 4px; }
.detail-sec { margin-top: 16px; }
.unlocks { margin: 0; padding-left: 16px; font: 400 13.5px/1.55 var(--font-ui); color: var(--sk-ink-soft); }
.next { margin: 0; padding-left: 20px; display: grid; gap: 6px; font: 400 14px/1.5 var(--font-ui); color: var(--sk-ink-soft); }
.related { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.related li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: start; font: 400 14px/1.45 var(--font-ui); color: var(--sk-ink-soft); }
.related .sk-label { justify-self: start; }
.deliver-list { list-style: none; margin: 4px 0 10px; padding: 0; border-top: 1px solid var(--sk-card-edge); }
.deliver-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; padding: 10px 2px; border-bottom: 1px solid var(--sk-ios-separator); }
.deliver-list__name { font: 700 14px/1.3 var(--font-ui); color: var(--sk-ink); }
.deliver-list__qty { grid-row: span 2; align-self: center; font: 300 24px/1 var(--font-display); color: var(--sk-ink); font-variant-numeric: tabular-nums; }
.deliver-list__meta { font: 400 12px/1.4 var(--font-ui); color: var(--sk-ios-header); }
.deliver-list__recipe { grid-column: 1 / -1; font: 400 12px/1.4 var(--font-ui); color: var(--sk-muted); }
.plan-links { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin: 12px 0 0; }
.plan-links .mini-h { flex-basis: 100%; margin: 0; }
.plan-links .link { margin: 0; }
.overview-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; margin-top: 18px; align-items: start; }
.overview-notes { display: grid; gap: 22px; padding: 4px 4px 0; }

/* ---- shared text ---- */
.lead { margin: 0 0 12px; font: 400 15px/1.5 var(--font-ui); color: var(--sk-ink-soft); }
.note { margin: 12px 0 0; font: 400 14px/1.5 var(--font-ui); color: var(--sk-ink-soft); }
.fine { margin: 10px 0 0; font: 400 12px/1.45 var(--font-ui); color: var(--sk-muted); }
.mini-h { margin: 0 0 6px; font: 700 11px/1.2 var(--font-ui); letter-spacing: 2px; text-transform: uppercase; color: var(--sk-ios-header); }
.bullets { margin: 0 0 12px; padding-left: 18px; font: 400 14px/1.5 var(--font-ui); color: var(--sk-ink-soft); }
.bullets li + li { margin-top: 4px; }
.practice { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font: 400 14px/1.5 var(--font-ui); color: var(--sk-ink-soft); }
.practice li { padding-left: 14px; position: relative; }
.practice li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--sk-ios-header); }
.practice b { color: var(--sk-ink); }
.cell-sub { display: block; margin-top: 2px; font: 400 12px/1.35 var(--font-ui); color: var(--sk-muted); }
.tscroll { overflow-x: auto; }
.tscroll > .sk-table-wrap { min-width: var(--tmin, 0); }
.sk-table td, .sk-table tbody th { padding: 9px 12px; }
.sk-table thead th { padding: 9px 12px 8px; }
.sk-table td.sk-table__num { font-size: 18px; }
.sticky-p { margin: 0 0 6px; }
.sticky-p:last-child { margin-bottom: 0; }
.kv { margin: 0; }
.kv__row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--sk-ios-separator); }
.kv__row:first-child { border-top: 0; }
.kv dt { font: 700 13px/1.35 var(--font-ui); color: var(--sk-ink); }
.kv dd { margin: 0; text-align: right; font: 400 13px/1.35 var(--font-ui); color: var(--sk-ios-detail); font-variant-numeric: tabular-nums; }
.seg-scroll { overflow-x: auto; scrollbar-width: none; max-width: 100%; padding: 2px 1px 3px; }
.seg-scroll::-webkit-scrollbar { display: none; }
.detail-src { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--sk-ios-separator); }
.refs-credits { margin-top: 16px; }
.src-list { list-style: none; margin: 0; padding: 0; }
.src-list li { display: flex; flex-direction: column; gap: 2px; padding: 9px 0; border-top: 1px solid var(--sk-ios-separator); }
.src-list li:first-child { border-top: 0; padding-top: 0; }
.src-list a { font: 700 14px/1.3 var(--font-ui); color: var(--sk-blue-ink); text-decoration: none; }
.src-list a:hover { text-decoration: underline; }
.src-list__pub { font: 400 12px/1.3 var(--font-ui); color: var(--sk-muted); }
.credits { margin: 0 0 12px; padding-left: 18px; font: 400 13px/1.5 var(--font-ui); color: var(--sk-ink-soft); }
.targets .sk-source, .overview-grid .sk-source, .card .sk-source { margin-top: 8px; }
.sources { margin: 0 0 12px; padding-left: 18px; font: 400 14px/1.6 var(--font-ui); }
.sources a { color: var(--sk-blue-ink); }

/* ---- setup ---- */
.setup-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
.setup-grid .col { display: flex; flex-direction: column; min-width: 0; }
.setup-sticky { margin: 22px 10px 0 4px; max-width: 360px; }
.area.sk-paper { padding: 16px 20px 18px !important; }
.area__head { margin: 0 0 10px; }
.area__name { margin: 6px 0 0; font: 200 30px/1.1 var(--font-display); color: var(--sk-ink); text-shadow: var(--sk-emboss-light); }
.area__grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 22px; }

<script>
  // Offline copy plus self-updating: when a new version is uploaded (sw.js changes),

  if ("serviceWorker" in navigator) {
    var hadController = !!navigator.serviceWorker.controller;

    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloading) return;

      location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        document.addEventListener("visibilitychange", function () {

    });
